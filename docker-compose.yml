services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOGCLI_VERSION: "0.40.0"
    image: aoc-app:latest
    container_name: aoc
    restart: unless-stopped
    stdin_open: true # Equivalent to -i
    tty: true        # Equivalent to -t
    init: true       # Proper signal forwarding and zombie reaping
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      # Container clock defaults to UTC. Align both the app-level setting and
      # the OS zone so dates in prompts, logs, and shell tools match the user.
      - TIMEZONE=${TIMEZONE:-America/Los_Angeles}
      - TZ=${TIMEZONE:-America/Los_Angeles}
      # Default PKM, codebase, and workspaces paths inside the container (can be overridden via .env)
      - PKM_DIR=${PKM_DIR:-/home/appuser/pkm}
      - CODEBASE_DIR=${CODEBASE_DIR:-/app}
      - TASKS_DB_PATH=${TASKS_DB_PATH:-/home/appuser/pkm/tasks.db}
      - WORKSPACES_DIR=${WORKSPACES_DIR:-/home/appuser/workspaces}
      # Git configuration for automated non-interactive sync and commits
      - GIT_TERMINAL_PROMPT=0
      - GIT_ASKPASS=
      - GIT_SSH_COMMAND=ssh -o BatchMode=yes -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15
      - GIT_USER_NAME=${GIT_USER_NAME:-AOC Bot}
      - GIT_USER_EMAIL=${GIT_USER_EMAIL:-aoc@localhost}
      # Machine-user PAT for git push / gh pr. The file lives in the project
      # directory on the host (chmod 600, gitignored) and arrives here through
      # the `.:/app` bind mount, so the default ~/github_bot_token never exists
      # in the container. Deliberately a path, not the token itself: putting the
      # secret in the environment would let `gh` pick it up for every call.
      - AOC_BOT_TOKEN_FILE=${AOC_BOT_TOKEN_FILE:-/app/github_bot_token}
      # Store gogcli auth and config in ./.gogcli in project root (no ~/.config/gogcli needed on host)
      - GOG_HOME=${GOG_HOME:-/app/.gogcli}
      - GOG_KEYRING_BACKEND=${GOG_KEYRING_BACKEND:-file}
    volumes:
      # Project directory mount for hot-reloading and live code edits (includes ./.gogcli)
      - .:/app
      # Host SSH keys staged read-only; entrypoint copies them into
      # /home/appuser/.ssh and /root/.ssh with correct per-user ownership.
      # Mounting directly onto ~/.ssh breaks root's git ("Bad owner or
      # permissions") because bind mounts keep the host UID.
      # NOTE: set SSH_HOST_DIR explicitly in .env when running under sudo --
      # "~" / $HOME resolve to /root for the sudo'ing user, which silently
      # mounts the wrong account's keys.
      - ${SSH_HOST_DIR:-${HOME}/.ssh}:/mnt/.ssh:ro
      # PKM storage directory mount (mapped to ../pkm on host machine)
      - ${PKM_HOST_DIR:-../pkm}:/home/appuser/pkm
      # Workspaces directory mount (mapped to ../workspaces on host machine)
      - ${WORKSPACES_HOST_DIR:-../workspaces}:/home/appuser/workspaces
      # Baked assets that are not in git (faster-whisper weights, ~150MB).
      # A named volume, not a bind mount: Docker populates it from the image the
      # first time it is used, so a fresh deploy still starts with the weights
      # the build downloaded, while later rebuilds reuse the volume instead of
      # re-fetching. Survives `docker compose down`; clear it with
      # `docker compose down -v` or `docker volume rm aoc_aoc-assets`.
      # NOTE: /opt/aoc-seed is deliberately NOT mounted -- it must track the
      # image, since Docker only seeds a volume while that volume is empty.
      - aoc-assets:/opt/aoc
    ports:
      # Chrome remote debugging port for visual AI browser automation (optional)
      - "9222:9222"

volumes:
  aoc-assets:
